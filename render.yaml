services:
  - type: web
    name: family-destiny
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt && python build.py
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 30
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
